name: Build Lightroom Auto Publish

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          python -c "import main; print('main.py imports OK')"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --clean --noconfirm --name "Lightroom自动发布工具" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Lightroom自动发布工具.exe
          if-no-files-found: error

      - name: Create Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lightroom自动发布工具.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
